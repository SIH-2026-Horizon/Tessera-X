[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tessera-x"
version = "0.1.0"
description = "Offline satellite imagery intelligence: retrieval, change detection, and evidence-backed analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "shapely",
    "rasterio>=1.4.4",
    "pillow>=12.3.0",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff>=0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_x"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
