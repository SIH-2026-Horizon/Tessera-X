[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tessera-x"
version = "0.1.0"
description = "Offline satellite imagery intelligence: retrieval, change detection, and evidence-backed analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "shapely",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tessera_x"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
